- name: Greffe
  gloss: court record
  icon: icon-greffe.svg
  family: Research and analysis
  summary: Records a session on your device and turns the transcript and marked-up photos into a protocol in which every statement cites its source.
  platforms: iOS · Android
  etymology: The greffe is the clerk's office of a French court, where the official record is kept.
- name: Indice
  gloss: clue
  icon: icon-indice.svg
  family: Research and analysis
  summary: An on-device iPhone aid for screening presentation slides for signs that they were generated by AI.
  platforms: iPhone
  etymology: "An indice is a clue: evidence that points somewhere without proving it."
- name: Charpente
  gloss: framework
  icon: icon-charpente.svg
  family: Revision decks
  summary: Revision deck for the German specialist exam in orthopaedics and trauma surgery, covering classifications, case schemes and SOPs.
  platforms: Anki deck
  etymology: Charpente means a timber framework, and also a skeleton.
- name: Secours
  gloss: rescue
  icon: icon-secours.svg
  family: Revision decks
  summary: Revision deck for the German additional qualification in emergency medicine, covering algorithms, doses, scenarios and SOPs.
  platforms: Anki deck
  etymology: Secours is help in an emergency, as in premiers secours, first aid.
